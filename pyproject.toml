[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicodesecbench"
version = "0.1.0"
description = "Static analysis benchmark for AI-attributed code snippets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rohan" }]
keywords = ["static-analysis", "ai-generated-code", "security", "codeql", "semgrep", "bandit"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.5,<1"]

[project.scripts]
aicodesecbench = "aicodesecbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aicodesecbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

